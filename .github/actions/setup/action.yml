name: Setup
description: PHP, Node, dependencies, the migrated database and the built assets, as every CI job needs them.

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: pcov

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Setup Application
      shell: bash
      run: composer setup
