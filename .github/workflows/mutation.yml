name: mutation

# Every Sunday night, and on demand, mutation testing of the business-logic classes on main (composer mutate:critical:
# every class a test declares in mutates(), minus controllers, form requests and notifications), one module at a time
# (scripts/mutate-critical.sh: a single run overflows the OS argument limit). It is no part of tests.yml, so it never
# blocks a pull request: when a module's score drops below --min the run fails, and GitHub emails it.
on:
  schedule:
    - cron: '0 5 * * 1' # Sunday 23:00 in Mexico City
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5433
  DB_DATABASE: testing
  DB_USERNAME: sail
  DB_PASSWORD: password

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mutation needs coverage to know which tests cover each line: PCOV.
      - uses: ./.github/actions/setup
        with:
          coverage: pcov

      - name: Mutation testing
        run: composer mutate:critical -- --min=95 --ignore-min-score-on-zero-mutations
