name: deploy

# Cuando el CI de main pasa y el cambio no fue solo documentación: construye las dos imágenes de producción del mismo commit (Dockerfile: `app` y `ssr`), las
# publica en GHCR y avisa a Dokploy, que descarga `latest` y reinicia compose.production.yaml. Después comprueba desde
# fuera que el sitio sirve la landing renderizada y que corre ese commit. A mano (workflow_dispatch) redespliega la rama elegida.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Un cambio que solo trajo documentación se saltó el pipeline (tests.yml, job `changes`) y las imágenes serían las
  # mismas, porque .dockerignore deja fuera docs (salvo docs/normas, que la app lee y cuenta como código): no se despliega. Se pregunta a esa corrida si su job `build` corrió (`tests` va en shards y su nombre lleva el número);
  # si no se puede leer la respuesta, se despliega.
  pipeline:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tests: ${{ steps.jobs.outputs.tests }}
    steps:
      - name: ¿Corrieron los tests de este commit?
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: echo "tests=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "build") | .conclusion')" >> "$GITHUB_OUTPUT"

  image:
    needs: pipeline
    # always(): a mano el job `pipeline` no corre, y sin esto GitHub se saltaría también este.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && needs.pipeline.outputs.tests != 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El mismo commit y el mismo GIT_SHA en las dos imágenes: la comprobación de abajo compara las metas de revisión
      # (build-revision, de Node; app-revision, de PHP). Cada una con su caché, para que no se pisen.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ssr
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-ssr:latest
            ghcr.io/${{ github.repository }}-ssr:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=ssr
          cache-to: type=gha,mode=max,scope=ssr

      # Webhook de "Deploy" del servicio en Dokploy (pestaña Deployments). Sin el secreto, sólo se publica la imagen.
      - name: Redeploy en Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        if: env.DOKPLOY_WEBHOOK_URL != ''
        # Dokploy ignores an empty POST («Branch Not Match», 301, which curl -f lets pass): it wants a GitHub push to its branch.
        run: |
          response=$(curl -sS -X POST "$DOKPLOY_WEBHOOK_URL" -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -d "{\"ref\":\"refs/heads/main\",\"head_commit\":{\"id\":\"$DEPLOY_SHA\",\"message\":\"deploy\"},\"repository\":{\"full_name\":\"$GITHUB_REPOSITORY\"}}")
          echo "$response"
          echo "$response" | grep -q 'Compose deployed successfully'

      # Espera a que Dokploy termine de reemplazar los contenedores (hasta 10 min) y falla si el sitio no sirve la landing
      # renderizada por Node con el commit recién publicado. Mismo criterio que synthetic.yml. Sin setup-node: el script no tiene
      # dependencias y el runner trae Node 20 o más.
      - name: Comprobar la landing desde fuera
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: node scripts/synthetic/check-landing.mjs --url https://humetria.com.mx/ --expect-revision ${{ github.event.workflow_run.head_sha || github.sha }} --wait 600
