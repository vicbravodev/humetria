name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5433
  DB_DATABASE: testing
  DB_USERNAME: sail
  DB_PASSWORD: password

# The jobs run side by side: the run takes as long as the slowest one, not their sum. Branch protection on main
# requires only the ci job, which waits for every other job: a job can be added or renamed without touching the
# settings. Mutation testing is not here: mutation.yml runs it every week, and it never blocks a pull request.
jobs:
  checks:
    runs-on: ubuntu-latest
    services: &postgres
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Audit Dependencies
        run: |
          composer audit
          npm audit --omit=dev

      - name: Frontend checks
        run: |
          npm run check
          npm run types:check
          npm run test:js

      - name: Pint, PHPStan and Unit/Feature with coverage
        run: |
          php artisan config:clear --ansi
          composer lint:check
          composer types:check
          php artisan test --coverage --min=90 --exclude-testsuite=Browser

  browser:
    runs-on: ubuntu-latest
    services: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: composer test:browser

  # The required check: every job passed.
  ci:
    needs: [checks, browser]
    # Runs even when a job fails, so this required check never shows as skipped: a failed job fails it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Failed jobs:"
            echo "$failed"
            exit 1
          fi
