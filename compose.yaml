services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - pgsql
            - mailtrap-local
            - rustfs
            - valkey
    # Vite starts with the stack and Docker restarts it if the process dies. Its node_modules lives in a
    # volume: the host's has macOS binaries (the tests run there), the container needs Linux ones.
    vite:
        image: 'sail-8.5/app'
        working_dir: /var/www/html
        entrypoint: ['bash', '-c']
        # npm ci only when package-lock.json changed since the last install, so a restart is quick.
        command:
            - '[ package-lock.json -ot node_modules/.installed ] || { npm ci --no-audit --no-fund && touch node_modules/.installed; }; exec npm run dev'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            LARAVEL_SAIL: 1
            VITE_PORT: '${VITE_PORT:-5173}'
        volumes:
            - '.:/var/www/html'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - laravel.test
    # Queue workers (Horizon) and the scheduler run beside the app on its image; Docker restarts them if they die.
    # After changing a job's code: `sail artisan horizon:terminate` and Docker brings Horizon back with it.
    horizon:
        image: 'sail-8.5/app'
        working_dir: /var/www/html
        command: ['php', 'artisan', 'horizon']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - laravel.test
            - pgsql
            - valkey
            - mailtrap-local
    scheduler:
        image: 'sail-8.5/app'
        working_dir: /var/www/html
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - laravel.test
            - pgsql
            - valkey
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    mailtrap-local:
        image: 'mailtrap/mailtrap-local:latest'
        ports:
            - '${FORWARD_MAILTRAP_LOCAL_PORT:-3535}:3535'
            - '${FORWARD_MAILTRAP_LOCAL_DASHBOARD_PORT:-3550}:3550'
        volumes:
            - 'sail-mailtrap-local:/var/lib/mailtrap-local'
        networks:
            - sail
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: sail
            RUSTFS_SECRET_KEY: password
            RUSTFS_LOG_LEVEL: info
        volumes:
            - 'sail-rustfs:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - sh
                - '-c'
                - 'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health'
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
    valkey:
        image: 'valkey/valkey:alpine'
        ports:
            - '${FORWARD_VALKEY_PORT:-6379}:6379'
        volumes:
            - 'sail-valkey:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - valkey-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    pgsql-data:
        driver: local
    sail-mailtrap-local:
        driver: local
    sail-rustfs:
        driver: local
    sail-valkey:
        driver: local
    sail-node-modules:
        driver: local
